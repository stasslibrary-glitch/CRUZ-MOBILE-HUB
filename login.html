<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#120d08">
  <link rel="icon" href="images/cruz1.png" type="image/png">
  <title>Login | Cruz Mobile Hub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
</head>
<body class="login-body">

  <main class="login-wrapper">
    <section class="login-brand">
      <img src="images/cruz1.png" alt="Cruz Mobile Hub" class="brand-icon">
      <p class="eyebrow">WELCOME TO</p>
      <h1>CRUZ <span>MOBILE HUB</span></h1>
      <p class="brand-description">
        Smart business. Better management.
      </p>

      <img src="images/cruz2.png" alt="" class="login-hero-image">
    </section>

    <section class="login-card">
      <div class="login-heading">
        <p class="eyebrow">ACCOUNT ACCESS</p>
        <h2>Sign in</h2>
        <p>Choose your account type to continue.</p>
      </div>

      <div class="login-tabs">
        <button type="button" class="login-tab active" data-role="admin">Administrator</button>
        <button type="button" class="login-tab" data-role="salesperson">Salesperson</button>
      </div>

      <form id="loginForm" class="login-form">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Enter email address"
          autocomplete="username"
          required
        >

        <label for="password">Password</label>
        <div class="password-field">
          <input
            type="password"
            id="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          >
          <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password" aria-pressed="false" title="Show password">
            <svg class="eye-icon eye-show" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            <svg class="eye-icon eye-hide" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.58 10.58A3 3 0 0 0 13.42 13.42M9.88 5.09A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a17.3 17.3 0 0 1-4.13 4.82M6.61 6.61C3.62 8.63 1 12 1 12s4 7 11 7a10.94 10.94 0 0 0 5.39-1.39" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>

        <button type="submit" class="gold-button" id="loginBtn">
          Sign in as Administrator
        </button>
      </form>

      <p id="loginMessage" class="login-message" aria-live="polite"></p>

      <div class="login-footer">
        <span>CRUZ MOBILE HUB</span>
        <span>SECURE BUSINESS ACCESS</span>
      </div>
    </section>
  </main>
<script type="module" src="js/theme-loader.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
